name: Build Android App

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Project Files
        run: |
          # Create settings.gradle.kts if missing
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo 'rootProject.name = "Spiritual-Companion"' > settings.gradle.kts
          fi
          
          # Create version catalog directory if missing and prevent unresolved references
          mkdir -p gradle
          if [ ! -f gradle/libs.versions.toml ]; then
            echo '[versions]' > gradle/libs.versions.toml
            echo 'google-services = "4.4.1"' >> gradle/libs.versions.toml
            echo '[plugins]' >> gradle/libs.versions.toml
            echo 'google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }' >> gradle/libs.versions.toml
          fi

      - name: Build with Gradle
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug
