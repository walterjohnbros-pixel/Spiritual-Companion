name: Build Android App

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Project Files
        run: |
          # Ensure settings.gradle.kts exists
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo 'rootProject.name = "Spiritual-Companion"' > settings.gradle.kts
          fi
          
          # Ensure build.gradle.kts has the Android application plugin
          if [ ! -f build.gradle.kts ] && [ ! -f build.gradle ]; then
            echo 'plugins { id("com.android.application") version "8.1.0" apply true }' > build.gradle.kts
          else
            # Append android plugin if missing
            TARGET_FILE=$([ -f build.gradle.kts ] && echo "build.gradle.kts" || echo "build.gradle")
            if ! grep -q "com.android.application" "$TARGET_FILE"; then
              echo 'plugins { id("com.android.application") version "8.1.0" apply true }' >> "$TARGET_FILE"
            fi
          fi

      - name: Build with Gradle
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug
