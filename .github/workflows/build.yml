name: Build Android App

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Project Files
        run: |
          # Create settings.gradle.kts if missing
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo 'rootProject.name = "Spiritual-Companion"' > settings.gradle.kts
          fi
          
          # Ensure a valid build file exists
          if [ -f Build.gradle.kt ]; then
            mv Build.gradle.kt build.gradle.kts
          elif [ ! -f build.gradle.kts ] && [ ! -f build.gradle ]; then
            echo 'plugins { id("com.android.application") version "8.1.0" apply false }' > build.gradle.kts
          fi

      - name: Build with Gradle
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug
